<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}TechShop{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<style>
body{background:#f8f9fa;}
.navbar-brand{font-weight:700;font-size:1.4rem;}
.product-card{transition:transform .2s,box-shadow .2s;border:none;border-radius:12px;}
.product-card:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,.12);}
.product-img{height:200px;object-fit:cover;border-radius:12px 12px 0 0;}
.badge-category{font-size:.7rem;}
.btn-add{border-radius:8px;}
.hero{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border-radius:16px;}
.cart-badge{position:relative;top:-8px;left:-6px;font-size:.65rem;}
footer{background:#2c3e50;color:#adb5bd;}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-cpu-fill text-primary me-2"></i>TechShop</a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/"><i class="bi bi-house me-1"></i>Accueil</a>
      <a class="nav-link" href="/cart">
        <i class="bi bi-cart3 me-1"></i>Panier
        {% if cart_count and cart_count > 0 %}
        <span class="badge bg-danger cart-badge">{{cart_count}}</span>
        {% endif %}
      </a>
    </div>
  </div>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
<footer class="mt-5 py-4 text-center">
  <div class="container">
    <p class="mb-0"><i class="bi bi-cpu me-2"></i>TechShop &copy; 2024 — Observabilite Demo</p>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
